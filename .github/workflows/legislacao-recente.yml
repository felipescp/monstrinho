# Verificação semanal da legislação recente (ferramentas/legislacao_recente.py).
# Descobre as normas novas (leis, LCs, MPs, emendas) pelos Dados Abertos do
# Senado e identifica, pela ementa, as leis da base que elas alteram. O
# Planalto bloqueia acesso automatizado, então o texto compilado não é baixado
# aqui: a issue aberta traz o link de cada lei a atualizar, para salvar a
# página e enviar numa sessão (curadoria + atualização do texto). Sem norma
# nova, não faz nada. Fonte fora do ar: a execução falha e o GitHub avisa.
name: Legislação recente (semanal)
on:
  schedule:
    - cron: '17 11 * * 1'   # segunda-feira, 8h17 em Brasília
  workflow_dispatch:
concurrency:
  group: legislacao-recente
  cancel-in-progress: false
permissions:
  contents: write
  issues: write
jobs:
  verificar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verificar normas novas (Dados Abertos do Senado)
        id: v
        run: |
          set -o pipefail
          python3 -I ferramentas/legislacao_recente.py | tee saida.txt
          grep -q '^mudou=1' saida.txt && echo "mudou=1" >> "$GITHUB_OUTPUT" || echo "mudou=0" >> "$GITHUB_OUTPUT"
      - name: Registrar e abrir issue com o relatório
        if: steps.v.outputs.mudou == '1'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add relatorios/legislacao-recente.md relatorios/novidades-pendentes.json relatorios/legislacao-recente-estado.json
          git commit -m "Legislação recente: verificação de $(date +%d/%m/%Y) (automático)"
          git pull --rebase origin main
          git push origin HEAD:main
          head -c 60000 relatorios/legislacao-recente.md > corpo.md
          gh issue create --title "Legislação recente — $(grep -m1 '^Normas novas' saida.txt | cut -c1-150)" --body-file corpo.md
