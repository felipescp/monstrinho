# Publica no Firebase a cada push no main: envia ao Storage só o que mudou em
# dados/ (sem os PDFs de origem), publica o app no Hosting e aplica as regras.
# Fica desligado até existir a variável de repositório FIREBASE_DEPLOY = sim
# e o secret FIREBASE_SERVICE_ACCOUNT (ver LEIAME-firebase.md).
name: Publicar no Firebase
on:
  push:
    branches: [main]
  workflow_dispatch:
concurrency:
  group: firebase
  cancel-in-progress: false
jobs:
  publicar:
    if: vars.FIREBASE_DEPLOY == 'sim'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Checagem do acervo (ferramentas/checar_acervo.py): compara com a versão
      # anterior ao envio e PARA a publicação se uma disciplina perder muitos
      # itens de uma vez, se um arquivo trouxer itens de outra disciplina ou
      # se ids passarem a se repetir. Redução intencional: "[reducao-intencional]"
      # na mensagem do commit.
      - name: Checagem do acervo (bloqueia a publicação se houver perda ou mistura)
        env:
          BASE: ${{ github.event.before }}
          MENSAGEM_COMMIT: ${{ github.event.head_commit.message }}
        run: |
          if [ -n "$BASE" ] && [ "$BASE" != "0000000000000000000000000000000000000000" ]; then
            git fetch -q --depth=1 origin "$BASE" || echo "Versão anterior indisponível; só as checagens de formato."
          fi
          python3 -I ferramentas/checar_acervo.py --base "$BASE"
      - uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@v2
      # Índice raso das baterias (sem enunciados): o app lê só ele no boot e
      # busca o arquivo completo de uma bateria quando ela é aberta.
      - name: Índice das baterias (carregamento sob demanda)
        run: python3 -I ferramentas/indice_baterias.py
      # Resumo de cada arquivo de Jurisprudência, Esquemas, Flashcards e
      # Glossário: o app só baixa de novo os que mudaram.
      - name: Versões dos arquivos oficiais
        run: python3 -I ferramentas/versoes_oficiais.py
      # Questões atualizadas (🔄 também nas baterias feitas antes da atualização).
      - name: Questões atualizadas
        run: python3 -I ferramentas/indice_atualizacoes.py
      - name: Acervo → Storage
        run: gcloud storage rsync dados gs://monstrinho-lab.firebasestorage.app/dados --recursive --delete-unmatched-destination-objects --exclude="^materiais/pdfs/"
      - name: Catálogo público da vitrine (sem questões)
        run: python3 -I ferramentas/vitrine_publica.py
      # Só na cópia publicada: o repositório guarda o código legível.
      # Comprime e embaralha o HTML/JS/CSS (≈ metade do tamanho) para
      # dificultar a cópia e o reaproveitamento do código.
      - name: Minificar o app (index.html e dashboard.html)
        run: |
          for f in index.html dashboard.html; do
            npx --yes html-minifier-terser@7.2.0 -c ferramentas/minificar.json -o "$f.min" "$f"
            test -s "$f.min" && mv "$f.min" "$f"
          done
      # Acesso intermediário: comentários da Lei Seca só do diploma mais
      # cobrado de cada disciplina (ordem do manifesto).
      - name: Regras do acesso intermediário
        run: python3 -I ferramentas/regras_intermediario.py
      - name: App e regras → Firebase
        run: npx --yes firebase-tools@13 deploy --only hosting,storage,firestore:rules --project monstrinho-lab --non-interactive
      # Funções (Criar Esquema com IA). Separado e sem travar a publicação do
      # site: enquanto os segredos e as permissões não estiverem configurados
      # (LEIAME-firebase.md, "Criar Esquema com IA"), esta etapa falha sozinha.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Funções → Firebase
        continue-on-error: true
        run: |
          cd functions && npm ci --no-audit --no-fund && cd ..
          npx --yes firebase-tools@15 deploy --only functions --project monstrinho-lab --non-interactive --force
