# Publica no Firebase a cada push no main: envia ao Storage só o que mudou em
# dados/ (sem os PDFs de origem), publica o app no Hosting e aplica as regras.
# Fica desligado até existir a variável de repositório FIREBASE_DEPLOY = sim
# e o secret FIREBASE_SERVICE_ACCOUNT (ver LEIAME-firebase.md).
name: Publicar no Firebase
on:
  push:
    branches: [main]
  workflow_dispatch:
concurrency:
  group: firebase
  cancel-in-progress: false
jobs:
  publicar:
    if: vars.FIREBASE_DEPLOY == 'sim'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@v2
      # Índice raso das baterias (sem enunciados): o app lê só ele no boot e
      # busca o arquivo completo de uma bateria quando ela é aberta.
      - name: Índice das baterias (carregamento sob demanda)
        run: python3 -I ferramentas/indice_baterias.py
      - name: Acervo → Storage
        run: gcloud storage rsync dados gs://monstrinho-lab.firebasestorage.app/dados --recursive --delete-unmatched-destination-objects --exclude="^materiais/pdfs/"
      - name: Catálogo público da vitrine (sem questões)
        run: python3 -I ferramentas/vitrine_publica.py
      # Só na cópia publicada: o repositório guarda o código legível.
      # Comprime e embaralha o HTML/JS/CSS (≈ metade do tamanho) para
      # dificultar a cópia e o reaproveitamento do código.
      - name: Minificar o app (index.html e dashboard.html)
        run: |
          for f in index.html dashboard.html; do
            npx --yes html-minifier-terser@7.2.0 -c ferramentas/minificar.json -o "$f.min" "$f"
            test -s "$f.min" && mv "$f.min" "$f"
          done
      - name: App e regras → Firebase
        run: npx --yes firebase-tools@13 deploy --only hosting,storage,firestore:rules --project monstrinho-lab --non-interactive
