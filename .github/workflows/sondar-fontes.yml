# Temporário: sonda fontes oficiais de dados abertos de legislação (Senado, LexML)
# para a verificação semanal. Remover depois de definida a fonte.
name: Sondar fontes de legislação (temporário)
on:
  workflow_dispatch:
jobs:
  sondar:
    runs-on: ubuntu-latest
    steps:
      - name: Sondar
        run: |
          python3 - <<'PY'
          import urllib.request
          U = [
            'https://legis.senado.leg.br/dadosabertos/legislacao/lista?tipo=LEI&ano=2026',
            'https://legis.senado.leg.br/dadosabertos/legislacao/lista.json?tipo=LEI&ano=2026',
            'https://legis.senado.leg.br/dadosabertos/legislacao/LEI/2026/15517',
            'https://legis.senado.leg.br/dadosabertos/legislacao/tiposNorma',
            'https://normas.leg.br/api/normas?tipo=lei&ano=2026',
            'https://www.lexml.gov.br/busca/SRU?operation=searchRetrieve&version=1.1&query=urn%3D%22urn%3Alex%3Abr%3Afederal%3Alei%3A2026%22&maximumRecords=3',
            'https://www.lexml.gov.br/urn/urn:lex:br:federal:lei:2026-10-30;15517',
            'https://dadosabertos.camara.leg.br/api/v2/proposicoes?siglaTipo=PL&ano=2026&itens=1',
          ]
          for u in U:
              for acc in ('application/json', 'application/xml'):
                  try:
                      r = urllib.request.urlopen(urllib.request.Request(u, headers={'Accept': acc, 'User-Agent': 'ASalinha-dados-abertos/1.0'}), timeout=40)
                      b = r.read()
                      print('==', u, acc, r.status, r.headers.get('Content-Type'), len(b))
                      print(b[:1500].decode('utf-8', 'replace'))
                  except Exception as e:
                      print('==', u, acc, 'ERRO', repr(e)[:300])
          PY
